name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Generate Android scaffold
        run: |
          flutter create --project-name bahir --org com.bahir /tmp/t --platforms android
          rm -rf android
          cp -r /tmp/t/android .
          mkdir -p android/app/src/main/kotlin/com/bahir/bahir
          printf 'package com.bahir.bahir\nimport io.flutter.embedding.android.FlutterActivity\nclass MainActivity: FlutterActivity()\n' > android/app/src/main/kotlin/com/bahir/bahir/MainActivity.kt
          sed -i 's/android:label="bahir"/android:label="BAHIR" android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bahir-release
          path: build/app/outputs/flutter-apk/app-release.apk
